name: qaro_tracker
description: QARO analytics — shared event tracker for the QARO Flutter apps. Batched, offline-buffered event capture that posts to the qaro-analytics ingest API.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0            # matches nannak-app (no dio)
  shared_preferences: ^2.3.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^4.0.0
