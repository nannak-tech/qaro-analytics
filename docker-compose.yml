# Local dev store for qaro-analytics. Prod uses managed Postgres (RDS).
services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: qaro
      POSTGRES_PASSWORD: qaro
      POSTGRES_DB: qaro_analytics
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro   # applies schema.sql on first boot

volumes:
  pg_data:
